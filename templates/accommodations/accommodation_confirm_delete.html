{% extends 'base.html' %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow border-danger">
                <div class="card-body text-center">
                    <h2 class="card-title text-danger mb-3">Изтриване на място</h2>
                    <p class="lead">Сигурни ли сте, че искате да изтриете <strong>"{{ object.name }}"</strong>?</p>
                    <p class="text-muted">Това действие е необратимо.</p>

                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-center gap-3 mt-4">
                            <button type="submit" class="btn btn-danger px-4">Да, изтрий</button>
                            <a href="{% url 'accommodation_detail' object.pk %}" class="btn btn-secondary px-4">Отказ</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h1>Редакция на профил</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">Запази промените</button>
        <a href="{% url 'profile-detail' %}" class="btn btn-secondary">Отказ</a>
    </form>
</div>
{% endblock %}

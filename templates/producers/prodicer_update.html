{% extends 'base.html' %}

{% block title %}Редакция на производител - Родопите отблизо{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm p-4">
                <h2 class="fw-bold text-success mb-4">✏️ Редактиране на производител</h2>

                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}

                    {% if form.non_field_errors %}
                        <div class="alert alert-danger">
                            {{ form.non_field_errors }}
                        </div>
                    {% endif %}

                    {{ form.as_p }}

                    <div class="d-flex justify-content-between mt-4">
                        <a href="{% url 'producer-detail' object.pk %}" class="btn btn-secondary">Отказ</a>
                        <button type="submit" class="btn btn-success">Запази промените</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock %}

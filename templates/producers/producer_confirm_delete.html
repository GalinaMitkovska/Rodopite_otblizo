{% extends 'base.html' %}

{% block title %}Изтриване на производител - Родопите отблизо{% endblock %}

{% block content %}
    <div class="row justify-content-center mt-5">
        <div class="col-md-6">
            <div class="card shadow-sm p-4 text-center">
                <h3 class="fw-bold text-danger mb-3">⚠️ Потвърждение за изтриване</h3>
                <p class="fs-5">Сигурни ли сте, че искате да изтриете производителя <strong>"{{ producer.name }}"</strong>?</p>
                <p class="text-muted small">Това действие е необратимо.</p>

                <form method="post" class="mt-4">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-3">
                        <a href="{% url 'producer-detail' producer.pk %}" class="btn btn-secondary px-4">Отказ</a>
                        <button type="submit" class="btn btn-danger px-4">Да, изтрий</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock %}

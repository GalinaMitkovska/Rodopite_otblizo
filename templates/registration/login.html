{% extends 'base.html' %}

{% block title %}Вход - Родопите отблизо{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm p-4">
            <h2 class="fw-bold text-success mb-4 text-center">🔑 Вход в системата</h2>

            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}

                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-success btn-lg">Влез</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
